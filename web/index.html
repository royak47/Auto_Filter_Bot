<!DOCTYPE html>

  <nav class="bottom-nav" aria-label="Main">
    <a href="#/" class="nav-item active" data-link data-nav="home">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-9.5z"/></svg>

    <a href="#/search" class="nav-item" data-link data-nav="search">

    <a href="#/latest" class="nav-item" data-link data-nav="latest">

    window.API_BASE = window.API_BASE || "";
